version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id_per_transaction
        tests:
          - unique
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: fact_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id_per_transaction
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id_per_transaction

  - name: fact_order_items
    description: "Tabella dei fatti delle linee d'ordine (Grana: un record per oggetto)"
    columns:
      - name: unique_order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: customer_id_per_transaction
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id_per_transaction