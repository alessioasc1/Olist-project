version: 2

models:
  - name: dim_customers
    description: "Customer dimension table with transactional granularity, enriched with geolocation details."
    columns:
      - name: customer_id_per_transaction
        description: "Primary key of the customer dimension, representing the unique ID for a specific order session."
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product dimension table containing catalog attributes and category names translated to English."
    columns:
      - name: product_id
        description: "Primary key of the product dimension."
        tests:
          - unique
          - not_null

  - name: dim_sellers
    description: "Seller dimension table containing seller registry details and consolidated geolocation data."
    columns:
      - name: seller_id
        description: "Primary key of the seller dimension."
        tests:
          - unique
          - not_null

  - name: fact_orders
    description: "Fact table for global orders. Granularity is one row per order, aggregating items and payment methods."
    columns:
      - name: order_id
        description: "Primary key of the orders fact table."
        tests:
          - unique
          - not_null
      - name: customer_id_per_transaction
        description: "Foreign key linking to dim_customers."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id_per_transaction

  - name: fact_order_items
    description: "Fact table for order lines. Granularity is one row per item inside the cart, acting as the center of the star schema."
    columns:
      - name: unique_order_item_id
        description: "Primary key generated by concatenating order_id and order_item_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key linking to the parent order in fact_orders."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key linking to dim_products."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: "Foreign key linking to dim_sellers."
        tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('dim_sellers')
                field: seller_id